[package]
name = "pq-msg"
version = "0.2.0"
edition = "2024"
description = "Pure Rust abstractions for higher-level implementations of post-quantum cryptography in secure messaging protocols."
license = "MIT OR Apache-2.0"
authors = ["OnlyF0uR"]
homepage = "https://github.com/OnlyF0uR/pq-msg"
repository = "https://github.com/OnlyF0uR/pq-msg"
readme = "README.md"

[dependencies]
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
fn-dsa = "0.4.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.0", features = ["zeroize"] }
zeroize = "1.9.1"
# fn-dsa takes a rand_core 0.6 RNG
rand_core = { version = "0.6.4", features = ["getrandom"] }

[features]
# In-memory reference prekey server, see `pq_msg::server`
server = []

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "prekey_server"
required-features = ["server"]
